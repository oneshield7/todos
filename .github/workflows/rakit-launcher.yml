name: Rakit APK launcher TV

on:
  push:
    branches:
      - "claude/android-tv-launcher-location-weather-okougy"
      - master
    paths:
      - "tv-launcher/**"
      - ".github/workflows/rakit-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rakit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Rakit APK debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nusantara-launcher-debug
          path: tv-launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
